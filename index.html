<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nephro Charges">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f766e">

<title>Nephro Charge Capture</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff;--bg2:#f4f6f9;--bg3:#e8ecf2;
  --tx:#0f172a;--tx2:#64748b;--tx3:#94a3b8;
  --bd:#e2e8f0;--bd2:#cbd5e1;
  --blue:#2563eb;--blue2:#eff6ff;--blue3:#bfdbfe;
  --green:#16a34a;--green2:#f0fdf4;--green3:#bbf7d0;
  --amber:#b45309;--amber2:#fffbeb;--amber3:#fde68a;
  --red:#dc2626;--red2:#fef2f2;--red3:#fecaca;
  --purple:#7c3aed;--purple2:#f5f3ff;--purple3:#ddd6fe;
  --teal:#0f766e;--teal2:#f0fdfa;--teal3:#99f6e4;
  --r:12px;--rs:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e293b;--bg2:#0f172a;--bg3:#334155;
  --tx:#f1f5f9;--tx2:#94a3b8;--tx3:#64748b;
  --bd:#334155;--bd2:#475569;
  --blue:#60a5fa;--blue2:#1e3a5f;--blue3:#1e40af;
  --green:#4ade80;--green2:#14532d;--green3:#166534;
  --amber:#fbbf24;--amber2:#451a03;--amber3:#78350f;
  --red:#f87171;--red2:#450a0a;--red3:#7f1d1d;
  --purple:#a78bfa;--purple2:#2e1065;--purple3:#4c1d95;
  --teal:#2dd4bf;--teal2:#042f2e;--teal3:#134e4a;
}}
html,body{min-height:100%;background:var(--bg2);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.brand{font-size:15px;font-weight:700}.brand-sub{font-size:11px;color:var(--tx2);margin-top:1px}
.tbar-right{display:flex;gap:7px;align-items:center}
.icon-btn{width:34px;height:34px;border:none;border-radius:var(--rs);background:var(--bg2);color:var(--tx2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bottomnav{display:flex;border-top:1px solid var(--bd);background:var(--bg);position:sticky;bottom:0;z-index:20}
.nb{flex:1;padding:11px 4px 9px;font-size:11px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
.nb.on{color:var(--blue)}.nb-icon{font-size:20px;line-height:1}
.page{flex:1;padding:14px 16px;padding-bottom:90px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sec{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);margin:18px 0 9px}
.sec.first{margin-top:0}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--bd2);background:var(--bg);color:var(--tx);font-family:inherit;-webkit-appearance:none;transition:opacity .1s}
.btn:active{opacity:.65}
.btn.blue{background:var(--blue2);color:var(--blue);border-color:var(--blue3)}
.btn.green{background:var(--green2);color:var(--green);border-color:var(--green3)}
.btn.red{background:var(--red2);color:var(--red);border-color:var(--red3)}
.btn.amber{background:var(--amber2);color:var(--amber);border-color:var(--amber3)}
.btn.purple{background:var(--purple2);color:var(--purple);border-color:var(--purple3)}
.btn.teal{background:var(--teal2);color:var(--teal);border-color:var(--teal3)}
.btn.sm{padding:6px 12px;font-size:12px}.btn.xs{padding:4px 9px;font-size:11px;font-weight:600}
.btn.block{width:100%;padding:13px}.btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.inp{width:100%;padding:9px 12px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit;-webkit-appearance:none}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.sel{width:100%;padding:9px 12px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit;-webkit-appearance:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;font-family:monospace}
.pill.blue{background:var(--blue2);color:var(--blue);border:1px solid var(--blue3)}
.pill.green{background:var(--green2);color:var(--green);border:1px solid var(--green3)}
.pill.gdash{background:var(--green2);color:var(--green);border:1px dashed var(--green3)}
.pill.purple{background:var(--purple2);color:var(--purple);border:1px solid var(--purple3)}
.px{cursor:pointer;font-size:15px;line-height:1;opacity:.55}.px:active{opacity:1}
.listbox{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;max-height:210px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;border-bottom:1px solid var(--bd)}
.lrow:last-child{border-bottom:none}.lrow:active{background:var(--bg3)}.lrow.on{background:var(--blue2)}
.lcode{font-size:12px;font-weight:700;font-family:monospace;min-width:56px;color:var(--blue)}
.ldesc{font-size:13px;color:var(--tx2);flex:1;line-height:1.3}.lrow.on .ldesc{color:var(--blue)}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.lrow.on .chk{background:var(--blue);border-color:var(--blue);color:#fff}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:9px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.ctab{padding:6px 13px;font-size:12px;font-weight:500;border:1px solid var(--bd);border-radius:20px;background:var(--bg);color:var(--tx2);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit}
.ctab.on{background:var(--blue2);color:var(--blue);border-color:var(--blue3)}
.modcard{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 12px;margin-bottom:8px}
.modrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.modsel{padding:5px 9px;font-size:12px;border:1px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--tx);font-family:inherit;flex:1;min-width:0;-webkit-appearance:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.drag{width:40px;height:4px;background:var(--bd2);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.toast{padding:11px 14px;border-radius:var(--rs);margin-bottom:12px;font-size:13px;font-weight:600}
.toast.green{background:var(--green2);color:var(--green);border:1px solid var(--green3)}
.toast.blue{background:var(--blue2);color:var(--blue);border:1px solid var(--blue3)}
.toast.amber{background:var(--amber2);color:var(--amber);border:1px solid var(--amber3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg2);border-radius:var(--rs);padding:12px;text-align:center;border:1px solid var(--bd)}
.stat-n{font-size:26px;font-weight:700}.stat-l{font-size:11px;color:var(--tx2);margin-top:2px}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.pthdr{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg2);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:14px}
.back{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--tx2);background:none;border:none;cursor:pointer;padding:0;margin-bottom:14px;font-weight:500;font-family:inherit}
.ptactions{display:flex;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid var(--bd);flex-wrap:wrap}
/* status */
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--rs);margin-bottom:14px;border:1px solid var(--bd)}
.status-bar.active{background:var(--green2);border-color:var(--green3)}
.status-bar.discharged{background:var(--amber2);border-color:var(--amber3)}
.status-label{font-size:14px;font-weight:700}
.status-bar.active .status-label{color:var(--green)}
.status-bar.discharged .status-label{color:var(--amber)}
.status-sub{font-size:12px;opacity:.8;margin-top:1px}
/* ICD panel (patient-level) */
.icd-panel{background:var(--purple2);border:1px solid var(--purple3);border-radius:var(--r);padding:13px;margin-bottom:14px}
.icd-panel-title{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.icd-panel-sub{font-size:12px;color:var(--purple);opacity:.8;margin-bottom:10px}
/* DOS cards */
.dos-card{border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.dos-header{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--bg2);cursor:pointer;border-bottom:1px solid var(--bd)}
.dos-header:active{background:var(--bg3)}
.dos-date{font-size:14px;font-weight:700;color:var(--tx)}
.dos-summary{font-size:12px;color:var(--tx2);margin-top:2px}
.dos-body{padding:13px}
.dos-chevron{font-size:18px;color:var(--tx2);transition:transform .2s;display:inline-block}
.dos-chevron.open{transform:rotate(180deg)}
/* upload */
.upload-zone{border:2px dashed var(--bd2);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;background:var(--bg2);transition:border-color .15s}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--blue);background:var(--blue2)}
.upload-zone input[type=file]{display:none}
.upload-icon{font-size:32px;margin-bottom:6px}
.upload-title{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:3px}
.upload-sub{font-size:12px;color:var(--tx2)}
.fs-preview{border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;margin-top:10px;position:relative}
.fs-preview img{width:100%;display:block}
.fs-remove{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}

.custom-icd{background:var(--bg2);border:2px dashed var(--bd2);border-radius:var(--r);padding:13px;margin-top:10px}
/* ICD 4-column category grid */
.icd-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.icd-col{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rs);overflow:hidden}
.icd-col-head{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;background:var(--bg3);border-bottom:1px solid var(--bd);color:var(--tx2)}
.icd-item{display:flex;align-items:flex-start;gap:5px;padding:5px 7px;cursor:pointer;border-bottom:1px solid var(--bd)}
.icd-item:last-child{border-bottom:none}
.icd-item:active{background:var(--bg3)}.icd-item.on{background:var(--blue2)}
.icd-code{font-size:10px;font-weight:700;font-family:monospace;color:var(--blue);flex-shrink:0;padding-top:1px;min-width:44px}
.icd-desc{font-size:10px;color:var(--tx2);line-height:1.35;flex:1}
.icd-item.on .icd-desc{color:var(--blue)}
.icd-chk{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;margin-left:auto;margin-top:1px}
.icd-item.on .icd-chk{background:var(--blue);border-color:var(--blue);color:#fff}
/* CPT dropdown */
.cpt-select{width:100%;padding:9px 12px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit;-webkit-appearance:none;margin-bottom:8px}
.empty{text-align:center;padding:48px 20px;color:var(--tx2)}
.empty-icon{font-size:44px;margin-bottom:12px}
.divider{height:1px;background:var(--bd);margin:16px 0}
.pills{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.banner{font-size:12px;color:var(--tx2);background:var(--bg2);border-top:1px solid var(--bd);padding:8px 16px;text-align:center}
.toggle-sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 9px}
.toggle-sec .sec{margin:0}
.toggle-btn{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.dot.active{background:var(--green)}.dot.discharged{background:var(--amber)}
/* info box */
.info-box{background:var(--blue2);border:1px solid var(--blue3);border-radius:var(--rs);padding:10px 13px;margin-bottom:12px;font-size:13px;color:var(--blue)}
</style>
</head>

var MEM={},LS=false;

function sGet(k){try{return LS?localStorage.getItem(k):MEM[k]||null;}catch(e){return MEM[k]||null;}}
function sSet(k,v){try{if(LS)localStorage.setItem(k,v);MEM[k]=v;}catch(e){MEM[k]=v;}}
function sDel(k){try{if(LS)localStorage.removeItem(k);}catch(e){}delete MEM[k];}

var SK='ncc_v6';

function today(){
  var d=new Date();
  var y=d.getFullYear();
  var m=String(d.getMonth()+1).padStart(2,'0');
  var day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function calcAge(dob){
  if(!dob)return '';
  try{var d=new Date(dob+'T12:00'),n=new Date(),a=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a>=0?String(a):''}catch(e){return '';}
}
function fmtD(d){try{return new Date(d+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return d;}}
function initials(n){return(n||'').split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2)||'?';}
function getPt(id){return DB.patients.find(function(p){return p.id===id;})||null;}
function selPt(){return getPt(PID);}
function dosCount(pt){return Object.keys(pt.charges||{}).length;}
function totalCodes(pt){var n=0;Object.values(pt.charges||{}).forEach(function(c){n+=(c.cpt||[]).length;});return n;}

// ── DOM ──────────────────────────────────────────────────────────────────────
function h(tag,props,kids){
  var el=document.createElement(tag);
  if(props)Object.keys(props).forEach(function(k){
    var v=props[k];
    if(k==='cls')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k[0]==='@')el.addEventListener(k.slice(1),v);
    else el.setAttribute(k,v);
  });
  if(kids)kids.forEach(function(c){if(c!=null&&c!==false)el.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return el;
}

var isIphoneDevice=/iPhone|iPad|iPod/.test(navigator.userAgent);
var isWindowsDevice=/Win/.test(navigator.platform||navigator.userAgent);

function getLastBackup(){try{var v=sGet(BK);return v?parseInt(v):null;}catch(e){return null;}}
function markBackupDone(){try{sSet(BK,String(Date.now()));}catch(e){}}
function hoursSinceBackup(){var last=getLastBackup();if(!last)return 9999;return(Date.now()-last)/(1000*60*60);}

function mkBackupBanner(){
  var last=getLastBackup();
  var hrs=hoursSinceBackup();
  var hasData=DB.patients.length>0;
  if(!LS){
    return h('div',{cls:'banner',style:{background:'var(--red2)',color:'var(--red)',borderTop:'1px solid var(--red3)',fontWeight:'600'}},
      ['\u26a0 Data not being saved \u2014 go to Summary \u2192 \ud83d\udcbe Backup now']);
  }
  if(!hasData||!isWindowsDevice){
    var last2=getLastBackup();
    var ago='';
    if(last2){var h2=hoursSinceBackup();ago=' \u00b7 Last backup: '+(h2<1?'just now':h2<24?Math.round(h2)+'h ago':Math.round(h2/24)+'d ago');}
    return h('div',{cls:'banner'},['\u2705 Data auto-saved on this device'+ago]);
  }
  if(isWindowsDevice&&hrs>24){
    var lastStr=last?('Last backup '+Math.round(hrs)+'h ago'):'Never backed up';
    return h('div',{cls:'banner',style:{
      background:'var(--amber2)',color:'var(--amber)',borderTop:'2px solid var(--amber3)',
      fontWeight:'600',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 16px',gap:'10px'
    }},[
      h('span',{},['\u26a0 '+lastStr+' \u2014 back up now to avoid data loss']),
      h('button',{style:{background:'var(--amber)',color:'#fff',border:'none',borderRadius:'6px',padding:'5px 12px',fontSize:'12px',fontWeight:'700',cursor:'pointer',fontFamily:'inherit',flexShrink:'0'},'@click':function(){autoBackupNow();}},['\ud83d\udcbe Back up now']),
    ]);
  }
  var ago2='';if(last){var h3=hoursSinceBackup();ago2=' \u00b7 Last backup: '+(h3<1?'just now':h3<24?Math.round(h3)+'h ago':Math.round(h3/24)+'d ago');}
  return h('div',{cls:'banner'},[
    '\u2705 Data saved'+ago2+' \u00b7 Auto-backup active on Windows',
  ]);
}

function autoBackupNow(){
  if(!DB.patients.length)return;
  var exp=JSON.parse(JSON.stringify(DB));
  exp.patients.forEach(function(p){p.facesheet=null;});
  var json=JSON.stringify(exp,null,2);
  var filename='nephro_backup_'+today()+'.json';
  try{
    var blob=new Blob([json],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);document.body.removeChild(a);},1500);
    markBackupDone();
    if(!MODAL)render();
    flash('\u2705 Backup saved: '+filename+' \u2014 move to WorkDrive to sync','green');
  }catch(e){flash('Backup failed \u2014 try manually from Summary \u2192 \ud83d\udcbe Backup','amber');}
}

function initAutoBackup(){
  if(!isWindowsDevice||!DB.patients.length)return;
  if(hoursSinceBackup()<12)return;
  setTimeout(function(){
    autoBackupNow();
  },4000);
}

      h('div',{style:{display:'flex',gap:'6px',marginBottom:'6px'}},[
        h('input',{cls:'inp',id:'_eName_'+pt.id,type:'text',value:pt.name,placeholder:'Patient name',style:{flex:'2'}}),
        h('input',{cls:'inp',id:'_eRoom_'+pt.id,type:'text',value:pt.room||'',placeholder:'Room',style:{flex:'1'}}),
      ]),
      h('div',{style:{display:'flex',gap:'6px',marginBottom:'6px'}},[
        h('input',{cls:'inp',id:'_eAge_'+pt.id,type:'text',inputmode:'numeric',value:pt.age||'',placeholder:'Age',maxlength:'3',style:{flex:'1',textAlign:'center'}}),
        h('select',{cls:'sel',id:'_eType_'+pt.id,style:{flex:'2'}},
          Object.keys(TM).map(function(k){var o=h('option',{value:k},[TM[k].label]);if(k===pt.type)o.selected=true;return o;})),
      ]),
      // DOB fields
      h('div',{style:{marginBottom:'8px'}},[
        h('div',{style:{fontSize:'11px',color:'var(--tx2)',marginBottom:'4px',fontWeight:'600'}},['Date of birth (MM / DD / YYYY)']),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1.6fr',gap:'6px'}},[
          h('input',{cls:'inp',id:'_eMM_'+pt.id,type:'text',inputmode:'numeric',
            value:pt.dob?String(parseInt(pt.dob.split('-')[1])):'',
            placeholder:'MM',maxlength:'2',style:{textAlign:'center'}}),
          h('input',{cls:'inp',id:'_eDD_'+pt.id,type:'text',inputmode:'numeric',
            value:pt.dob?String(parseInt(pt.dob.split('-')[2])):'',
            placeholder:'DD',maxlength:'2',style:{textAlign:'center'}}),
          h('input',{cls:'inp',id:'_eYY_'+pt.id,type:'text',inputmode:'numeric',
            value:pt.dob?pt.dob.split('-')[0]:'',
            placeholder:'YYYY',maxlength:'4',style:{textAlign:'center'}}),
        ]),
      ]),
      // Admission date
      h('div',{style:{marginBottom:'8px'}},[
        h('div',{style:{fontSize:'11px',color:'var(--tx2)',marginBottom:'4px',fontWeight:'600'}},['Admission date']),
        h('input',{cls:'inp',id:'_eAdmit_'+pt.id,type:'date',value:pt.admitDate||''}),
      ]),
      h('div',{style:{display:'flex',gap:'6px'}},[
        h('button',{cls:'btn blue sm','@click':function(){
          var nameEl=document.getElementById('_eName_'+pt.id);
          var newName=(nameEl?nameEl.value:'').trim();
          if(!newName){if(nameEl)nameEl.style.borderColor='red';return;}
          var p2=getPt(pt.id);
          if(!p2)return;
          p2.name=newName;
          var roomEl=document.getElementById('_eRoom_'+pt.id);
          if(roomEl)p2.room=roomEl.value.trim();
          var ageEl=document.getElementById('_eAge_'+pt.id);
          if(ageEl)p2.age=ageEl.value.trim();
          var typeEl=document.getElementById('_eType_'+pt.id);
          if(typeEl)p2.type=typeEl.value;
          // DOB
          var mmEl=document.getElementById('_eMM_'+pt.id);
          var ddEl=document.getElementById('_eDD_'+pt.id);
          var yyEl=document.getElementById('_eYY_'+pt.id);
          if(mmEl&&ddEl&&yyEl){
            var mm=(mmEl.value||'').replace(/\D/g,'');
            var dd=(ddEl.value||'').replace(/\D/g,'');
            var yy=(yyEl.value||'').replace(/\D/g,'');
            if(mm&&dd&&yy&&yy.length===4){
              p2.dob=yy+'-'+(mm.length===1?'0':'')+mm+'-'+(dd.length===1?'0':'')+dd;
              if(!p2.age)p2.age=calcAge(p2.dob);
            } else if(!mm&&!dd&&!yy){
              p2.dob=''; // cleared
            }
          }
          // Admission date
          var admitEl=document.getElementById('_eAdmit_'+pt.id);
          if(admitEl&&admitEl.value)p2.admitDate=admitEl.value;
          save();EDITING_PT=null;flash('Patient updated');render();
        }},['Save']),
        h('button',{cls:'btn sm','@click':function(){EDITING_PT=null;render();}},['Cancel']),
      ]),
    ]):null,
    // inline readmit form
    READMIT_PT===pt.id?h('div',{style:{padding:'12px 0',borderTop:'2px solid var(--teal)',marginTop:'8px',background:'var(--teal2)',borderRadius:'0 0 var(--r) var(--r)',margin:'8px -1px -1px',padding:'12px'}},[
      h('div',{style:{fontWeight:'700',color:'var(--teal)',fontSize:'13px',marginBottom:'6px'}},['Readmit — new admission']),
      h('div',{style:{fontSize:'12px',color:'var(--teal)',marginBottom:'10px'}},
        ['Previous charges will be cleared. Enter new admission date to continue.']),
      h('div',{style:{display:'grid',gridTemplateColumns:'2fr 1fr',gap:'8px',alignItems:'end',marginBottom:'10px'}},[
        h('div',{},[
          h('div',{style:{fontSize:'11px',color:'var(--teal)',marginBottom:'3px',fontWeight:'600'}},['New admission date']),
          h('input',{cls:'inp',id:'_readmitDate_'+pt.id,type:'date',value:today(),
            style:{borderColor:'var(--teal)'}}),
        ]),
        h('div',{},[
          h('div',{style:{fontSize:'11px',color:'var(--teal)',marginBottom:'3px',fontWeight:'600'}},['Room']),
          h('input',{cls:'inp',id:'_readmitRoom_'+pt.id,type:'text',
            value:pt.room||'',placeholder:'Room',
            style:{borderColor:'var(--teal)'}}),
        ]),
      ]),
      h('div',{style:{display:'flex',gap:'8px'}},[
        h('button',{cls:'btn',style:{flex:'1',background:'var(--teal)',color:'#fff',border:'none'},'@click':function(){
          var dateEl=document.getElementById('_readmitDate_'+pt.id);
          var roomEl=document.getElementById('_readmitRoom_'+pt.id);
          var newDate=(dateEl?dateEl.value:'')||today();
          var newRoom=roomEl?(roomEl.value||'').trim():p2.room||'';
          var p2=getPt(pt.id);
          if(!p2)return;
          // Keep original patient DISCHARGED with all its charges intact
          // Create a FRESH patient record for the new admission
          var newPt={
            id:Date.now(),
            name:p2.name,
            room:newRoom,
            dob:p2.dob,
            age:p2.age,
            type:p2.type,
            admitDate:newDate,
            status:'active',
            facesheet:null,
            icd:[],
            charges:{},
            _officeFup:false,
            _ttiGlobal:p2._ttiGlobal||false,
          };
          // Add new record to top of list — original stays discharged with charges
          DB.patients.unshift(newPt);
          save();
          READMIT_PT=null;
          flash(p2.name+' readmitted — new record created, previous charges preserved in discharged list');
          render();
        }},['✓ Confirm readmission']),
        h('button',{cls:'btn sm','@click':function(){READMIT_PT=null;render();}},['Cancel']),
      ]),
    ]):null,
  ]);
}

// ── CHARGE VIEW ──────────────────────────────────────────────────────────────
function chargeView(){
  var pt=selPt();if(!pt)return h('div',{},[]);
  var tm=TM[pt.type]||TM.consult,isActive=pt.status==='active';
  var f=document.createDocumentFragment();

  f.appendChild(h('button',{cls:'back','@click':function(){V='census';EDOS=null;render();}},[' ← Patients']));

  // patient header
  f.appendChild(h('div',{cls:'pthdr'},[
    h('div',{cls:'av',style:{background:tm.bg,color:tm.fg}},[initials(pt.name)]),
    h('div',{style:{flex:'1'}},[
      h('div',{style:{fontWeight:'700',fontSize:'16px'}},[
        pt.name,
        pt.age?h('span',{style:{fontWeight:'400',fontSize:'13px',color:'var(--tx2)',marginLeft:'8px'}},['Age '+pt.age]):null,
      ]),
      h('div',{style:{display:'flex',gap:'6px',marginTop:'4px',flexWrap:'wrap'}},[
        h('span',{cls:'badge',style:{background:tm.bg,color:tm.fg}},[tm.label]),
        pt.room?h('span',{style:{fontSize:'12px',color:'var(--tx2)'}},[' Rm '+pt.room]):null,
        pt.admitDate?h('span',{style:{fontSize:'12px',color:'var(--tx2)'}},['Admitted '+fmtD(pt.admitDate)]):null,
      ]),
    ]),
  ]));

  // status bar
  f.appendChild(h('div',{cls:'status-bar '+(isActive?'active':'discharged')},[
    h('div',{},[
      h('div',{cls:'status-label'},[isActive?'● Active inpatient':'○ Discharged']),
      h('div',{cls:'status-sub',style:{color:isActive?'var(--green)':'var(--amber)'}},[isActive?'Currently admitted':'No longer inpatient']),
    ]),
    isActive
      ?h('button',{cls:'btn xs amber','@click':function(){setPtStatus(pt.id,'discharged');render();}},[' Mark discharged'])
      :h('button',{cls:'btn xs teal','@click':function(){
          var newDate=prompt('New admission date (YYYY-MM-DD):',today());
          if(newDate===null)return;
          if(!newDate)newDate=today();
          var p2=getPt(pt.id);if(!p2)return;
          // Create fresh record, leave discharged record with its charges
          var newPt={id:Date.now(),name:p2.name,room:p2.room,dob:p2.dob,age:p2.age,
            type:p2.type,admitDate:newDate,status:'active',facesheet:null,icd:[],charges:{},
            _officeFup:false,_ttiGlobal:p2._ttiGlobal||false};
          DB.patients.unshift(newPt);
          save();QUICK_ROUND=false;
          flash(p2.name+' readmitted — previous charges preserved in discharged list');render();
        }},[' Readmit']),
  ]));

  // remove patient button
  f.appendChild(h('div',{style:{display:'flex',justifyContent:'flex-end',marginBottom:'14px'}},[
    h('button',{cls:'btn sm red','@click':function(){
      if(confirm('Remove '+pt.name+' from census?\n\nThis will permanently delete all their charges and cannot be undone.')){
        DB.patients=DB.patients.filter(function(p){return p.id!==pt.id;});
        save();V='census';PID=null;flash(pt.name+' removed','amber');render();
      }
    }},['🗑 Remove patient from census']),
  ]));


  // ── DATES OF SERVICE ──
  f.appendChild(h('div',{cls:'sec'},['Dates of service']));
  var charges=pt.charges||{};
  var dosKeys=Object.keys(charges).sort(function(a,b){return b.localeCompare(a);});

  // ── ADD DATE PANEL ────────────────────────────────────────────────────────
  var panelICD=[];
  var panelDateCPT={};   // {date: [{code,desc,mod}]}

  var hasPrevDOS=dosKeys.length>0;
  var prevCPT0=[];
  if(hasPrevDOS){var pd0=charges[dosKeys[0]];if(pd0&&pd0.cpt&&pd0.cpt.length)prevCPT0=JSON.parse(JSON.stringify(pd0.cpt));}

  var getDateList=function(from,to){
    if(!from)return[];if(!to||to<from)to=from;
    var dates=[],cur=new Date(from+'T12:00'),end=new Date(to+'T12:00'),MAX=31;
    while(cur<=end&&dates.length<MAX){dates.push(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);}
    return dates;
  };
  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var fmtDay=function(d){var dt=new Date(d+'T12:00');return DAYS[dt.getDay()]+' '+fmtD(d);};

  // CPT helpers
  var mkCPTOpt=function(selEl,defaultLabel){
    selEl.innerHTML='';
    var def=document.createElement('option');def.value='';def.text=defaultLabel;selEl.appendChild(def);
    CPTS.forEach(function(item){
      if(item.g){var og=document.createElement('optgroup');og.label=item.g;selEl.appendChild(og);return;}
      var o=document.createElement('option');o.value=item.code;o.text=item.code+' — '+item.desc;selEl.appendChild(o);
    });
  };

  var panel=h('div',{style:{background:'var(--bg2)',border:'1px solid var(--bd)',borderRadius:'var(--rs)',padding:'11px 12px',marginBottom:'12px'}},[]);
  panel.appendChild(h('div',{style:{fontSize:'11px',fontWeight:'700',color:'var(--tx2)',marginBottom:'7px',textTransform:'uppercase',letterSpacing:'.05em'}},['Add date(s) of service']));

  // From / To
  var fromInp=h('input',{cls:'inp',type:'date',value:today()});
  var toInp=h('input',{cls:'inp',type:'date',value:today()});
  panel.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'6px',alignItems:'center',marginBottom:'10px'}},[
    h('div',{},[h('div',{style:{fontSize:'10px',color:'var(--tx2)',marginBottom:'3px'}},['From']),fromInp]),
    h('div',{style:{textAlign:'center',color:'var(--tx3)',fontSize:'12px',paddingTop:'16px'}},['→']),
    h('div',{},[h('div',{style:{fontSize:'10px',color:'var(--tx2)',marginBottom:'3px'}},['To (same for single day)']),toInp]),
  ]));

  // ── ICD — shared (entered first) ─────────────────────────────────────────
  panel.appendChild(h('div',{style:{fontSize:'11px',fontWeight:'700',color:'var(--tx2)',marginBottom:'5px'}},
    ['Diagnoses — same for all dates']));
  if(hasPrevDOS){
    var prevICD0=(charges[dosKeys[0]]&&charges[dosKeys[0]].icd)||[];
    if(prevICD0.length&&!panelICD.length)panelICD=JSON.parse(JSON.stringify(prevICD0));
  }
  var pillWrap=h('div',{style:{display:'flex',flexWrap:'wrap',gap:'4px',marginBottom:'6px',minHeight:'22px'}},[]);
  var buildPanelPills=function(){
    pillWrap.innerHTML='';
    if(!panelICD.length){
      pillWrap.style.color='var(--tx3)';pillWrap.style.fontSize='12px';
      pillWrap.appendChild(document.createTextNode('None selected'));
    } else {
      pillWrap.style.color='';pillWrap.style.fontSize='';
      panelICD.forEach(function(c){
        var pill=document.createElement('span');pill.className='pill purple';
        pill.style.cssText='display:inline-flex;align-items:center;gap:3px;';
        pill.innerHTML='<b>'+c.code+'</b><span style="font-size:9px;opacity:.75"> '+c.desc+'</span>'
          +'<span class="px" style="cursor:pointer;font-size:13px;margin-left:2px;opacity:.6">×</span>';
        pill.querySelector('.px').addEventListener('click',function(){
          panelICD=panelICD.filter(function(x){return x.code!==c.code;});buildPanelPills();
        });
        pillWrap.appendChild(pill);
      });
    }
  };
  buildPanelPills();
  panel.appendChild(pillWrap);
  panel.appendChild(mkIcdSearch('🔍 Search diagnoses (type 2+ chars)…',
    function(code,desc){
      if(!panelICD.find(function(x){return x.code===code;})){panelICD.push({code:code,desc:desc,custom:false});buildPanelPills();}
    },
    function(){return panelICD;}
  ));

  // ── INITIAL + SUBSEQUENT CPT SELECTORS ─────────────────────────────────────
  panel.appendChild(h('div',{style:{fontSize:'11px',fontWeight:'700',color:'var(--tx2)',marginBottom:'6px',marginTop:'10px'}},['CPT codes']));

  var initSel=document.createElement('select');initSel.className='cpt-select';initSel.style.marginBottom='6px';
  mkCPTOpt(initSel,'Day 1 — Initial CPT (e.g. 99223)');
  var subsSel=document.createElement('select');subsSel.className='cpt-select';subsSel.style.marginBottom='10px';
  mkCPTOpt(subsSel,'All other days — Subsequent CPT (e.g. 99233)');

  // Pre-select from previous DOS if available
  if(prevCPT0.length){
    Array.from(initSel.options).forEach(function(o){if(o.value===prevCPT0[0].code)o.selected=true;});
    Array.from(subsSel.options).forEach(function(o){if(o.value===prevCPT0[0].code)o.selected=true;});
  }

  var applyDefaultsToGrid=function(){buildDateGrid();};
  initSel.addEventListener('change',applyDefaultsToGrid);
  subsSel.addEventListener('change',applyDefaultsToGrid);
  panel.appendChild(initSel);
  panel.appendChild(subsSel);

  // ── PER-DATE GRID ──────────────────────────────────────────────────────────
  var dateGrid=document.createElement('div');
  dateGrid.style.marginBottom='10px';
  panel.appendChild(dateGrid);

  var buildDateGrid=function(){
    var dates=getDateList(fromInp.value,toInp.value);
    var initCode=initSel.value;
    var subsCode=subsSel.value;
    dates.forEach(function(d,idx){
      var code=idx===0?initCode:subsCode;
      var item=code?CPTS.find(function(x){return x.code===code;}):null;
      if(!panelDateCPT[d]){panelDateCPT[d]=item?[{code:item.code,desc:item.desc,mod:''}]:[];}
    });
    dateGrid.innerHTML='';
    if(!dates.length)return;
    dates.forEach(function(d,idx){
      var dateCPT=panelDateCPT[d]||[];
      var currentCode=dateCPT.length?dateCPT[0].code:'';
      var row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:7px 9px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rs);';
      var lbl=document.createElement('div');
      lbl.style.cssText='font-size:11px;font-weight:700;color:var(--tx2);min-width:86px;flex-shrink:0;';
      lbl.textContent=fmtDay(d);
      row.appendChild(lbl);
      var chip=document.createElement('span');
      chip.style.cssText='flex:1;font-size:12px;font-weight:700;color:'+(currentCode?'var(--green)':'var(--tx3)')+';';
      chip.textContent=currentCode||'—';
      row.appendChild(chip);
      var chgSel=document.createElement('select');
      chgSel.className='sel';
      chgSel.style.cssText='font-size:11px;flex-shrink:0;max-width:170px;';
      var defOpt=document.createElement('option');defOpt.value='';defOpt.text='Change…';chgSel.appendChild(defOpt);
      CPTS.forEach(function(item){
        if(item.g){var og=document.createElement('optgroup');og.label=item.g;chgSel.appendChild(og);return;}
        var o=document.createElement('option');o.value=item.code;o.text=item.code;
        if(item.code===currentCode){o.selected=true;}
        chgSel.appendChild(o);
      });
      chgSel.addEventListener('change',function(){
        var code=chgSel.value;if(!code)return;
        var item=CPTS.find(function(x){return x.code===code;});if(!item)return;
        // ── CASCADE FORWARD ──
        var allDates=getDateList(fromInp.value,toInp.value);
        var fromHere=false;
        allDates.forEach(function(di){
          if(di===d)fromHere=true;
          if(fromHere)panelDateCPT[di]=[{code:item.code,desc:item.desc,mod:''}];
        });
        buildDateGrid();
      });
      row.appendChild(chgSel);
      dateGrid.appendChild(row);
    });
    if(addBtn)addBtn.textContent='+ Add '+dates.length+' date'+(dates.length!==1?'s':'');
  };

  fromInp.addEventListener('change',function(){panelDateCPT={};buildDateGrid();});
  toInp.addEventListener('change',function(){
    var dates=getDateList(fromInp.value,toInp.value);
    dates.forEach(function(d,idx){
      if(!panelDateCPT[d]){
        var code=idx===0?initSel.value:subsSel.value;
        var item=code?CPTS.find(function(x){return x.code===code;}):null;
        panelDateCPT[d]=item?[{code:item.code,desc:item.desc,mod:''}]:[];
      }
    });
    buildDateGrid();
  });

  // ── ADD BUTTON ─────────────────────────────────────────────────────────────
  var addBtn=null;
  var addBtnEl=h('button',{cls:'btn blue block',style:{marginTop:'8px'},'@click':function(){
    var from=fromInp.value,to=toInp.value;
    if(!from){flash('Pick a start date','amber');return;}
    var dates=getDateList(from,to);
    if(!dates.length){flash('Pick a valid date range','amber');return;}
    var p2=getPt(pt.id);if(!p2.charges)p2.charges={};
    var added=0;
    dates.forEach(function(d){
      if(!p2.charges[d]){
        var cpt=panelDateCPT[d]||[];
        p2.charges[d]={cpt:JSON.parse(JSON.stringify(cpt)),icd:JSON.parse(JSON.stringify(panelICD)),notes:'',_carried:cpt.length>0,_icdCarried:panelICD.length>0};
        added++;
      }
    });
    save();EDOS=dates[0];
    flash(added+' date'+(added!==1?'s':'')+' added','blue');
    render();
  }},['+ Add dates']);
  addBtn=addBtnEl;
  panel.appendChild(addBtnEl);
  buildDateGrid(); // initial build after addBtn is set

  f.appendChild(panel);

  if(!dosKeys.length){
    f.appendChild(h('div',{style:{fontSize:'13px',color:'var(--tx3)',padding:'4px 0',marginBottom:'8px'}},['No dates yet — pick a date or range above']));
  }
  dosKeys.forEach(function(d){
    var dc=charges[d];
    var isEditing=EDOS===d;
    var hasCodes=dc.cpt&&dc.cpt.length>0;
    var isNotSeen=!!dc._notSeen;

    var header=h('div',{cls:'dos-header',style:{background:isNotSeen?'var(--bg3)':''},
      '@click':function(){EDOS=isEditing?null:d;ECCODE='';ECDESC='';ECERR='';render();}},[
      h('div',{},[
        h('div',{cls:'dos-date',style:{color:isNotSeen?'var(--tx2)':''}},[
          fmtD(d),
          isNotSeen?h('span',{style:{fontSize:'11px',fontWeight:'600',color:'var(--tx2)',marginLeft:'8px',fontFamily:'sans-serif'}},['⊘ Not seen']):null,
        ]),
        h('div',{cls:'dos-summary'},[
          isNotSeen?'Not billed — patient not seen':
          hasCodes?dc.cpt.map(function(c){return c.code+(c.mod?'-'+c.mod:'');}).join(', '):'No CPT codes yet',
          !isNotSeen&&dc._carried?' ↩ carried over':'',
        ]),
      ]),
      h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},[
        h('button',{cls:'btn xs',style:{flexShrink:'0',background:isNotSeen?'var(--teal2)':'var(--bg2)',color:isNotSeen?'var(--teal)':'var(--tx2)',border:'1px solid '+(isNotSeen?'var(--teal3)':'var(--bd2)')},'@click':function(e){
          e.stopPropagation();
          var p2=getPt(pt.id);if(!p2)return;
          p2.charges[d]._notSeen=!p2.charges[d]._notSeen;
          save();render();
        }},[isNotSeen?'Undo':'⊘ Not seen']),
        !isNotSeen?h('button',{cls:'btn xs',style:{flexShrink:'0',background:'var(--green2)',color:'var(--green)',border:'1px solid var(--green3)'},'@click':function(e){
          e.stopPropagation();exportDayCSV(d);
        }},['⬇ CSV']):null,
        h('button',{cls:'btn xs red',style:{flexShrink:'0'},'@click':function(e){
          e.stopPropagation();
          if(confirm('Remove charges for '+fmtD(d)+'?')){
            var p2=getPt(pt.id);if(p2&&p2.charges)delete p2.charges[d];
            if(EDOS===d)EDOS=null;save();render();
          }
        }},['✕']),
        h('span',{cls:'dos-chevron'+(isEditing?' open':'')},['⌄']),
      ].filter(Boolean)),
    ]);
    var kids=[header];
    if(isEditing)kids.push(h('div',{cls:'dos-body'},[dosEditor(pt,d,dc)]));
    f.appendChild(h('div',{cls:'dos-card'},kids));
  });

  return h('div',{},[f]);
}

// ── PATIENT-LEVEL ICD PANEL ──────────────────────────────────────────────────
// ── REUSABLE SEARCHABLE ICD PICKER ───────────────────────────────────────────
// onSelect(code, desc) called when user picks a code
// selectedFn() returns array of {code} already selected (to show ✓)
function mkIcdSearch(placeholder, onSelect, selectedFn){
  var wrap=h('div',{style:{position:'relative',marginBottom:'8px'}},[]);
  var inp=h('input',{cls:'inp',type:'text',placeholder:placeholder||'🔍 Search ICD codes…',
    autocomplete:'off',style:{width:'100%'}});
  var drop=h('div',{style:{
    position:'absolute',top:'100%',left:'0',right:'0',zIndex:'100',
    background:'var(--bg)',border:'1px solid var(--bd)',borderRadius:'var(--rs)',
    boxShadow:'0 4px 16px rgba(0,0,0,.12)',maxHeight:'200px',overflowY:'auto',display:'none',
  }},[]);

  var buildDrop=function(q){
    drop.innerHTML='';
    if(!q||q.length<2){drop.style.display='none';return;}
    var qlo=q.toLowerCase();
    var matches=ICDS_FLAT.filter(function(p){
      return p[0].toLowerCase().indexOf(qlo)>=0||p[1].toLowerCase().indexOf(qlo)>=0;
    }).slice(0,30);
    if(!matches.length){
      var none=document.createElement('div');
      none.style.cssText='padding:9px 12px;font-size:13px;color:var(--tx3)';
      none.textContent='No matches for "'+q+'"';
      drop.appendChild(none);
    } else {
      matches.forEach(function(pair){
        var code=pair[0],desc=pair[1];
        var sel=!!(selectedFn()||[]).find(function(x){return x.code===code;});
        var row=document.createElement('div');
        row.style.cssText='padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);'
          +(sel?'background:var(--green2);':'');
        row.innerHTML='<span style="font-family:monospace;font-weight:700;font-size:12px;flex-shrink:0;color:'+(sel?'var(--green)':'var(--blue)')+'">'+code+'</span>'
          +'<span style="font-size:12px;flex:1;color:var(--tx)">'+desc+'</span>'
          +(sel?'<span style="color:var(--green);font-weight:700;flex-shrink:0">✓</span>':'');
        row.addEventListener('mousedown',function(e){e.preventDefault();});
        row.addEventListener('click',function(){
          onSelect(code,desc);
          inp.value='';
          drop.style.display='none';
          buildDrop('');
        });
        // hover
        row.addEventListener('mouseenter',function(){if(!sel)row.style.background='var(--bg2)';});
        row.addEventListener('mouseleave',function(){if(!sel)row.style.background='';});
        drop.appendChild(row);
      });
    }
    drop.style.display='block';
  };

  inp.addEventListener('input',function(){buildDrop(inp.value.trim());});
  inp.addEventListener('focus',function(){if(inp.value.trim().length>=2)buildDrop(inp.value.trim());});
  inp.addEventListener('blur',function(){setTimeout(function(){drop.style.display='none';},150);});

  wrap.appendChild(inp);
  wrap.appendChild(drop);
  return wrap;
}

// ── SUMMARY ──────────────────────────────────────────────────────────────────
function analyticsView(){
  var f=document.createDocumentFragment();

  // ── DATE RANGE STATE ──────────────────────────────────────────────────────
  if(!window._aRange)window._aRange='month'; // month|last|q3|year|all
  var range=window._aRange;

  // Compute from/to for the range
  var now=new Date();
  var y=now.getFullYear(),m=now.getMonth()+1;
  var toStr=today();
  var fromStr='';
  if(range==='month'){
    fromStr=y+'-'+(m<10?'0':'')+m+'-01';
  } else if(range==='last'){
    var lm=m===1?12:m-1,ly=m===1?y-1:y;
    var ld=new Date(ly,lm,0).getDate();
    fromStr=ly+'-'+(lm<10?'0':'')+lm+'-01';
    toStr=ly+'-'+(lm<10?'0':'')+lm+'-'+(ld<10?'0':'')+ld;
  } else if(range==='q3'){
    var d3=new Date(now);d3.setMonth(d3.getMonth()-3);
    var y3=d3.getFullYear(),m3=d3.getMonth()+1;
    fromStr=y3+'-'+(m3<10?'0':'')+m3+'-01';
  } else if(range==='year'){
    fromStr=y+'-01-01';
  } else {
    fromStr='2000-01-01'; // all time
  }

  // ── COMPUTE STATS ─────────────────────────────────────────────────────────
  var cptCount={},icdCount={},monthPts={},monthDOS={};
  var totalPtSet=new Set(),totalDOS=0,notSeenDOS=0,ttiCount=0,fupCount=0;
  var longestStay=0,longestName='',totalStayDays=0,dischargedWithAdmit=0;
  var newConsults=0;

  DB.patients.forEach(function(pt){
    if(pt._ttiGlobal)ttiCount++;
    if(pt._officeFup)fupCount++;

    // Length of stay for discharged patients
    if(pt.status==='discharged'&&pt.admitDate){
      var dosKeys2=Object.keys(pt.charges||{}).sort();
      if(dosKeys2.length){
        var lastDOS=dosKeys2[dosKeys2.length-1];
        var ms=(new Date(lastDOS+'T12:00'))-(new Date(pt.admitDate+'T12:00'));
        var days=Math.round(ms/86400000)+1;
        if(days>0){
          totalStayDays+=days;dischargedWithAdmit++;
          if(days>longestStay){longestStay=days;longestName=pt.name.split(',')[0];}
        }
      }
    }

    // Charges in date range
    Object.keys(pt.charges||{}).forEach(function(dos){
      if(dos<fromStr||dos>toStr)return;
      var dc=pt.charges[dos];
      totalPtSet.add(pt.id);
      totalDOS++;
      if(dc._notSeen){notSeenDOS++;return;}

      // Track first DOS (new consult detection)
      var allKeys=Object.keys(pt.charges||{}).sort();
      if(allKeys[0]===dos)newConsults++;

      // Monthly buckets
      var mon=dos.slice(0,7);
      if(!monthPts[mon])monthPts[mon]=new Set();
      if(!monthDOS[mon])monthDOS[mon]=0;
      monthPts[mon].add(pt.id);
      monthDOS[mon]++;

      (dc.cpt||[]).forEach(function(c){
        if(!c.code)return;
        cptCount[c.code]=cptCount[c.code]||{code:c.code,desc:c.desc,n:0};
        cptCount[c.code].n++;
      });
      (dc.icd||[]).concat(pt.icd||[]).forEach(function(c){
        if(!c.code)return;
        icdCount[c.code]=icdCount[c.code]||{code:c.code,desc:c.desc,n:0};
        icdCount[c.code].n++;
      });
    });
  });

  var totalPts=totalPtSet.size;
  var avgStay=dischargedWithAdmit?Math.round(totalStayDays/dischargedWithAdmit):0;
  var cptList=Object.values(cptCount).sort(function(a,b){return b.n-a.n;});
  var icdList=Object.values(icdCount).sort(function(a,b){return b.n-a.n;}).slice(0,10);

  // Monthly chart data (last 6 months or range months)
  var chartMonths=Object.keys(monthPts).sort().slice(-6);
  var maxPts=Math.max.apply(null,chartMonths.map(function(m){return monthPts[m].size||0;}))||1;

  // ── UI HELPERS ────────────────────────────────────────────────────────────
  function stat(val,label,sub){
    return h('div',{style:{
      background:'var(--bg2)',border:'1px solid var(--bd)',borderRadius:'var(--rs)',
      padding:'12px',textAlign:'center',flex:'1',minWidth:'80px',
    }},[
      h('div',{style:{fontSize:'24px',fontWeight:'800',color:'var(--blue)',lineHeight:'1.1'}},[String(val)]),
      h('div',{style:{fontSize:'11px',fontWeight:'600',color:'var(--tx)',marginTop:'3px'}},[label]),
      sub?h('div',{style:{fontSize:'10px',color:'var(--tx3)',marginTop:'2px'}},[sub]):null,
    ]);
  }

  function sec(title){
    return h('div',{style:{fontSize:'11px',fontWeight:'700',color:'var(--tx2)',
      textTransform:'uppercase',letterSpacing:'.06em',margin:'18px 0 8px'}},[title]);
  }

  // ── BUILD UI ──────────────────────────────────────────────────────────────
  f.appendChild(h('div',{style:{fontSize:'17px',fontWeight:'800',marginBottom:'12px'}},[
    '📊 Analytics',
  ]));

  // Range tabs
  var ranges=[
    {k:'month',l:'This month'},
    {k:'last', l:'Last month'},
    {k:'q3',   l:'Last 3 mo'},
    {k:'year', l:'This year'},
    {k:'all',  l:'All time'},
  ];
  f.appendChild(h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'14px'}},
    ranges.map(function(r){
      return h('button',{
        cls:'btn sm'+(range===r.k?' blue':''),
        style:{fontSize:'11px'},
        '@click':function(){window._aRange=r.k;render();}
      },[r.l]);
    })
  ));

  // Key stats row
  var rangeLabel=range==='month'?'this month':range==='last'?'last month':range==='q3'?'last 3 months':range==='year'?'this year':'all time';
  f.appendChild(h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'4px'}},[
    stat(totalPts,'Patients',rangeLabel),
    stat(totalDOS,'Dates of service',rangeLabel),
    stat(notSeenDOS,'Not seen',rangeLabel),
  ]));
  f.appendChild(h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'4px',marginTop:'8px'}},[
    stat(cptList.reduce(function(s,c){return s+c.n;},0),'Total CPT codes',rangeLabel),
    stat(avgStay>0?avgStay+'d':'—','Avg stay',dischargedWithAdmit+' discharged'),
    stat(ttiCount,'TTI Global','total flagged'),
  ]));

  // Monthly patient volume chart
  if(chartMonths.length>0){
    f.appendChild(sec('Monthly patient volume'));
    f.appendChild(h('div',{style:{background:'var(--bg2)',border:'1px solid var(--bd)',borderRadius:'var(--rs)',padding:'10px 12px'}},[
      h('div',{},chartMonths.map(function(mon){
        var pts=monthPts[mon]?monthPts[mon].size:0;
        var dos=monthDOS[mon]||0;
        var pct=Math.round((pts/maxPts)*100);
        var label=mon.slice(0,7);
        var d=new Date(mon+'-15');
        var mname=d.toLocaleString('default',{month:'short',year:'2-digit'});
        return h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px'}},[
          h('div',{style:{fontSize:'11px',color:'var(--tx2)',width:'48px',flexShrink:'0',textAlign:'right'}},[mname]),
          h('div',{style:{flex:'1',height:'18px',background:'var(--bd)',borderRadius:'3px',overflow:'hidden'}},[
            h('div',{style:{
              height:'100%',width:pct+'%',background:'var(--blue)',
              borderRadius:'3px',transition:'width .3s',minWidth:pts>0?'18px':'0',
              display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:'4px',
            }},[pts>0?h('span',{style:{fontSize:'10px',color:'#fff',fontWeight:'700'}},[String(pts)]):null]),
          ]),
          h('div',{style:{fontSize:'11px',color:'var(--tx3)',width:'36px',flexShrink:'0'}},[dos+' DOS']),
        ]);
      })),
    ]));
  }

  // CPT breakdown table
  if(cptList.length>0){
    f.appendChild(sec('CPT code breakdown'));
    var maxCPT=cptList[0].n||1;
    f.appendChild(h('div',{style:{background:'var(--bg2)',border:'1px solid var(--bd)',borderRadius:'var(--rs)',overflow:'hidden'}},[
      h('table',{style:{width:'100%',borderCollapse:'collapse'}},[ 
        h('thead',{},[
          h('tr',{style:{background:'var(--bg3)',fontSize:'11px',color:'var(--tx2)',fontWeight:'700'}},[ 
            h('th',{style:{padding:'7px 10px',textAlign:'left'}},['CPT']),
            h('th',{style:{padding:'7px 10px',textAlign:'left'}},['Description']),
            h('th',{style:{padding:'7px 10px',textAlign:'right'}},['Count']),
            h('th',{style:{padding:'7px 10px',width:'80px'}},['Bar']),
          ]),
        ]),
        h('tbody',{},cptList.map(function(c,i){

function submitAddPatient(){
  var nameEl=document.getElementById('_ptName');
  var name=(nameEl?nameEl.value||'':'').trim();
  if(!name){
    if(nameEl){nameEl.style.borderColor='red';nameEl.focus();}
    // Don't flash - it would call render() in some paths. Just visual feedback only.
    return;
  }
  var room  = (document.getElementById('_ptRoom')   ? document.getElementById('_ptRoom').value   : '').trim();
  var type  =  document.getElementById('_ptType')   ? document.getElementById('_ptType').value   : 'consult';
  var mm    = (document.getElementById('_ptMM')     ? document.getElementById('_ptMM').value     : '').replace(/\D/g,'');
  var dd    = (document.getElementById('_ptDD')     ? document.getElementById('_ptDD').value     : '').replace(/\D/g,'');
  var yy    = (document.getElementById('_ptYY')     ? document.getElementById('_ptYY').value     : '').replace(/\D/g,'');
  var ageV  = (document.getElementById('_ptAge')    ? document.getElementById('_ptAge').value    : '').trim();
  var admit =  document.getElementById('_ptAdmit')  ? document.getElementById('_ptAdmit').value  : today();
  var dob='';
  if(mm&&dd&&yy&&yy.length===4){
    dob=yy+'-'+(mm.length===1?'0':'')+mm+'-'+(dd.length===1?'0':'')+dd;
  }
  var age=ageV||calcAge(dob)||'';
  DB.patients.unshift({
    id:Date.now(),name:name,room:room,dob:dob,age:age,
    type:type,admitDate:admit||today(),
    status:'active',facesheet:null,icd:[],charges:{}
  });
  save();
  MODAL=null;  // close modal BEFORE any render/flash
  TOAST=null;
  clearTimeout(TOAST_T);
  render();    // render census — modal is now closed so this is safe
  flash('Patient added — tap their name to add charges');
}

// Wire up DOB auto-tab and age calculation via event delegation
// Called after modal renders
function wireDOBFields(){
  var mm=document.getElementById('_ptMM');
  var dd=document.getElementById('_ptDD');
  var yy=document.getElementById('_ptYY');
  var ag=document.getElementById('_ptAge');
  if(!mm||!dd||!yy)return;
  var recalc=function(){
    var m=(mm.value||'').replace(/\D/g,'');
    var d=(dd.value||'').replace(/\D/g,'');
    var y=(yy.value||'').replace(/\D/g,'');
    if(m&&d&&y&&y.length===4){
      var dob2=y+'-'+(m.length===1?'0':'')+m+'-'+(d.length===1?'0':'')+d;
      var a=calcAge(dob2);
      if(a&&ag)ag.value=a;
    }
  };
  mm.addEventListener('input',function(){
    mm.value=mm.value.replace(/\D/g,'').slice(0,2);
    if(mm.value.length>=2&&dd)dd.focus();
    recalc();
  });
  dd.addEventListener('input',function(){
    dd.value=dd.value.replace(/\D/g,'').slice(0,2);
    if(dd.value.length>=2&&yy)yy.focus();
    recalc();
  });
  yy.addEventListener('input',function(){
    yy.value=yy.value.replace(/\D/g,'').slice(0,4);
    recalc();
  });
}

// patient-level ICD
function togglePtICD(ptId,code,desc,custom){
  var pt=getPt(ptId);if(!pt)return;
  if(!pt.icd)pt.icd=[];
  var i=pt.icd.findIndex(function(x){return x.code===code;});
  if(i>=0)pt.icd.splice(i,1);else pt.icd.push({code:code,desc:desc,custom:!!custom});
  save();render();
}
function addCustomPtICD(ptId){
  var code=ECCODE.trim().toUpperCase(),desc=ECDESC.trim();
  if(!code){ECERR='Enter a code';render();return;}
  if(!desc){ECERR='Enter a description';render();return;}
  var pt=getPt(ptId);if(!pt)return;
  if(!pt.icd)pt.icd=[];
  if(pt.icd.find(function(x){return x.code===code;})){ECERR='Already added';render();return;}
  pt.icd.push({code:code,desc:desc,custom:true});
  save();ECCODE='';ECDESC='';ECERR='';render();
}

// ── CHARGE TEXT BUILDER ──────────────────────────────────────────────────────
function buildChargeText(fsIds){
  var today2=today();
  var lines=['NEPHROLOGY CHARGE CAPTURE'];
  lines.push('Practice: '+DB.cfg.practice);
  lines.push('Sent: '+fmtD(today2));
  lines.push('');

  // Facesheet note
  if(fsIds&&fsIds.length){
    var fsNames=fsIds.map(function(id){var pt=getPt(id);return pt?pt.name+(pt.room?' (Rm '+pt.room+')':''):'';}).filter(Boolean);
    if(fsNames.length){
      lines.push('⚠ PLEASE ATTACH FACESHEETS for:');
      fsNames.forEach(function(n){lines.push('  • '+n);});
      lines.push('');
    }
  }

  // TTI Global billing verification warning
  var ttiPts=DB.patients.filter(function(p){return p._ttiGlobal;});
  if(ttiPts.length){
    lines.push('⚠ BILLING VERIFICATION REQUIRED:');
    lines.push('The following patient'+(ttiPts.length>1?'s require':'requires')+' verification —');
    lines.push('please confirm whether to bill TTI GLOBAL or INSURANCE:');
    ttiPts.forEach(function(p){lines.push('  • '+p.name+(p.room?' (Rm '+p.room+')':''));});
    lines.push('');
  }

  // Group by date of service for clean layout
  var allDOS={};
  DB.patients.forEach(function(pt){
    Object.keys(pt.charges||{}).sort().forEach(function(d){
      if(!allDOS[d])allDOS[d]=[];
      allDOS[d].push(pt);
    });
  });

  var dosKeys=Object.keys(allDOS).sort(function(a,b){return b.localeCompare(a);});

  dosKeys.forEach(function(d){
    lines.push('═══════════════════════════════');
    lines.push('DATE OF SERVICE: '+fmtD(d));
    lines.push('═══════════════════════════════');
    allDOS[d].forEach(function(pt){
      var dc=pt.charges[d];
      if(dc._notSeen){
        // Include not-seen as a note to biller — not a billable entry
        lines.push('');
        lines.push('Patient : '+pt.name+(pt.room?' | Rm '+pt.room:''));
        lines.push('⊘ NOT SEEN this date — no charge');
        lines.push('───────────────────────────────');
        return;
      }
      var tm=TM[pt.type]||TM.consult;
      lines.push('');
      lines.push('Patient : '+pt.name+(pt.age?' | Age '+pt.age:'')+(pt.room?' | Rm '+pt.room:''));
      lines.push('Type    : '+tm.label+' | '+(pt.status==='active'?'Active inpatient':'Discharged'));
      if(pt.admitDate) lines.push('Admitted: '+fmtD(pt.admitDate));
      // TTI Global billing flag
      if(pt._ttiGlobal){
        lines.push('⚠ BILLING : VERIFY — TTI GLOBAL vs INSURANCE');
      }
      // CPT codes
      if(dc.cpt&&dc.cpt.length){
        lines.push('CPT     : '+dc.cpt.map(function(c){return c.code+(c.mod?' ['+c.mod+']':'')+' — '+c.desc;}).join('\n          '));
      } else {
        lines.push('CPT     : (none)');
      }
      var btIcd=dc.icd||pt.icd||[];
      if(btIcd.length){
        lines.push('ICD-10  : '+btIcd.map(function(c){return c.code+' — '+c.desc;}).join('\n          '));
      } else {
        lines.push('ICD-10  : (none)');
      }

      lines.push('───────────────────────────────');
    });
    lines.push('');
  });

  if(!dosKeys.length){
    lines.push('No charges logged yet.');
  }

  return lines.join('\n');
}

// ── SHARE via Web Share API (opens Zoho Mail on iPhone) ───────────────────
function shareCharges(fsIds){
  if(fsIds&&fsIds.length){
    fsIds.forEach(function(id,i){
      setTimeout(function(){var pt=getPt(id);if(pt)downloadFacesheet(pt);},i*700);
    });
  }

  var text=buildChargeText(fsIds);
  var title='Nephrology Charges — '+fmtD(today());
  var billerEmail=DB.cfg&&DB.cfg.email?DB.cfg.email:'';

  if(navigator.share){
    // iPhone — opens iOS share sheet, tap Zoho Mail from the list
    navigator.share({title:title,text:text}).then(function(){
      flash('Charges shared ✓');
    }).catch(function(err){
      if(err.name!=='AbortError'){
        copyTextToClipboard(text);
        flash('Share unavailable — copied to clipboard instead','blue');
      }
    });
  } else {
    // Windows / desktop — copy to clipboard then open Zoho Mail compose
    copyTextToClipboard(text);
    // Build Zoho Mail compose URL
    var subject=encodeURIComponent(title);
    var to=encodeURIComponent(billerEmail);
    var zohoUrl='https://mail.zoho.com/mail/compose?to='+to+'&subject='+subject;
    // Open Zoho Mail in new tab — user pastes from clipboard
    window.open(zohoUrl,'_blank');
    flash('✓ Charges copied — paste (Ctrl+V) into the Zoho Mail window that just opened','green');
  }
}

// ── COPY to clipboard ────────────────────────────────────────────────────────
function copyCharges(fsIds){
  if(fsIds&&fsIds.length){
    fsIds.forEach(function(id,i){
      setTimeout(function(){var pt=getPt(id);if(pt)downloadFacesheet(pt);},i*700);
    });
  }
  var text=buildChargeText(fsIds);
  copyTextToClipboard(text);
}

function copyTextToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      flash('✓ Copied! Open Zoho Mail → New email → paste (long-press in body)','green');
    }).catch(function(){
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{
    document.execCommand('copy');
    flash('✓ Copied! Open Zoho Mail → New email → paste','green');
  }catch(e){
    flash('Could not copy automatically — please select and copy manually','amber');
  }
  document.body.removeChild(ta);
}

  var lines=[];
  lines.push('OFFICE FOLLOW-UP LIST');
  lines.push('Generated: '+fmtD(today()));
  lines.push('═'.repeat(40));
  lines.push('');
  pts.forEach(function(pt,i){
    lines.push((i+1)+'. '+pt.name);
    if(pt.age)lines.push('   Age: '+pt.age);
    if(pt.room)lines.push('   Room: '+pt.room);
    if(pt.dob)lines.push('   DOB: '+fmtD(pt.dob));
    if(pt.admitDate)lines.push('   Admit: '+fmtD(pt.admitDate));
    lines.push('   Status: '+pt.status.charAt(0).toUpperCase()+pt.status.slice(1));
    lines.push('');
  });
  lines.push('Total: '+pts.length+' patient'+(pts.length!==1?'s':''));

  // Also build CSV
  var hdr=['Patient','Age','DOB','Room','Admit Date','Status'];
  var rows=[hdr];
  pts.forEach(function(pt){
    rows.push([pt.name,pt.age||'',pt.dob||'',pt.room||'',pt.admitDate||'',pt.status]);
  });
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');

  dlText(csv,'office_fup_'+today()+'.csv','text/csv');
  flash('Office FUP list downloaded — '+pts.length+' patient'+(pts.length!==1?'s':''));
}

function exportJSON(){
  var exp=JSON.parse(JSON.stringify(DB));
  exp.patients.forEach(function(p){p.facesheet=null;});
  dlText(JSON.stringify(exp,null,2),'nephro_backup_'+today()+'.json','application/json');
  markBackupDone();
  render();
}

// Share the backup file via iOS share sheet (AirDrop, WorkDrive, Zoho Mail, etc.)
function shareBackup(){
  var exp=JSON.parse(JSON.stringify(DB));
  exp.patients.forEach(function(p){p.facesheet=null;});
  var json=JSON.stringify(exp,null,2);
  var filename='nephro_backup_'+today()+'.json';

  try{
    // Create a File object and share it
    var blob=new Blob([json],{type:'application/json'});
    var file=new File([blob],filename,{type:'application/json'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({
        title:'Nephro Backup — '+today(),
        text:'Nephrology charge capture backup — import on other device',
        files:[file]
      }).then(function(){markBackupDone();flash('Backup shared ✓');render();})
        .catch(function(e){if(e.name!=='AbortError')exportJSON();});
      return;
    }
  }catch(e){}
  // Fallback: regular download
  exportJSON();
  flash('Saved to Downloads — upload to WorkDrive or OneDrive to sync','blue');
}

function importData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){
    if(!inp.files||!inp.files[0])return;
    processImportFile(inp.files[0]);
  };
  inp.click();
}

function processImportFile(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imp=JSON.parse(e.target.result);
      if(!imp.patients||!imp.cfg)throw new Error('bad format');

      var added=0,updated=0;
      imp.patients.forEach(function(p){
        var existing=DB.patients.find(function(x){return x.id===p.id;});
        if(!existing){
          // New patient — add but preserve any facesheet from current device
          DB.patients.push(p);added++;
        } else {
          // Existing patient — merge charges (imported charges + local charges, keep all)
          var mergedCharges=Object.assign({},existing.charges||{},p.charges||{});
          // Merge ICD codes (combine, deduplicate by code)
          var allICD=(existing.icd||[]).concat(p.icd||[]);
          var seenICD={};
          var mergedICD=allICD.filter(function(c){if(seenICD[c.code])return false;seenICD[c.code]=true;return true;});
          // Update fields from imported version, but keep local facesheet if present
          Object.assign(existing,p,{
            charges:mergedCharges,
            icd:mergedICD,
            facesheet:existing.facesheet||p.facesheet||null
          });
          updated++;
        }
      });
      // Update settings if imported has them
      if(imp.cfg.practice)DB.cfg.practice=imp.cfg.practice;
      if(imp.cfg.email)DB.cfg.email=imp.cfg.email;
      save();MODAL=null;
      flash('Imported: '+added+' new patient'+(added!==1?'s':'')+', '+updated+' updated','blue');
      render();
    }catch(ex){flash('Invalid backup file — check it is a .json export from this app','amber');}
  };
  reader.readAsText(file);
}

// Drag and drop import — works on desktop
function setupDragDrop(){
  document.addEventListener('dragover',function(e){
    e.preventDefault();
    document.getElementById('app').style.outline='3px dashed var(--blue)';
  });
  document.addEventListener('dragleave',function(e){
    if(!e.relatedTarget)document.getElementById('app').style.outline='';
  });
  document.addEventListener('drop',function(e){
    e.preventDefault();
    document.getElementById('app').style.outline='';
    var file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!file)return;
    if(file.name.endsWith('.json')||file.type==='application/json'){
      processImportFile(file);
    } else {
      flash('Drop a .json backup file to import','amber');
    }
  });
}

function dlText(content,filename,mime){
  try{
    var blob=new Blob([content],{type:mime});var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);document.body.removeChild(a);},1000);
  }catch(e){
    var w=window.open('','_blank');
    if(w){w.document.write('<pre style="font-family:monospace;font-size:12px;white-space:pre-wrap;padding:16px">'+content.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre><p style="font-family:sans-serif;padding:16px;color:#555">Save as <b>'+filename+'</b></p>');w.document.title=filename;}
  }
}

function flash(msg,t){
  clearTimeout(TOAST_T);
  TOAST={m:msg,t:t||'green'};
  // Only re-render if no modal is open — rendering while modal is open
  // destroys the form inputs and wipes whatever the user has typed
  if(!MODAL)render();
  TOAST_T=setTimeout(function(){
    TOAST=null;
    if(!MODAL)render();
  },3500);
}

render();
setupDragDrop();
initAutoBackup();
</script>
